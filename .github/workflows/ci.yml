name: CI

# Runs the checks that catch regressions without needing any production
# secrets: typecheck, lint, the licensing suite (token crypto + the
# activation engine, which runs on an in-memory PGlite database), and the
# Dodo webhook signature tests (pure crypto, no network).
#
# The delivery / payments e2e suites are deliberately NOT wired here —
# they need live test-mode credentials and a reachable gateway, so they
# stay operator-run (`npm run test:delivery:e2e`, `npm run dodo:setup`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck · lint · licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Licensing tests
        run: npm run test:licensing

      - name: Dodo webhook signature tests
        run: npm run test:dodo
